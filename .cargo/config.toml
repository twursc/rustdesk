[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-args=/NODEFAULTLIB:MSVCRT"]
[target.'cfg(target_os="macos")']
rustflags = [
    "-C", "link-args=-sectcreate __CGPreLoginApp __cgpreloginapp /dev/null",
]
#[target.'cfg(target_os="linux")']
# glibc-static required, this may fix https://github.com/rustdesk/rustdesk/issues/9103, but I do not want this big change
# this is unlikely to help also, because the other so files still use libc dynamically
#rustflags = [
#    "-C", "link-args=-Wl,-Bstatic -lc -Wl,-Bdynamic"
#]
[target.aarch64-unknown-linux-ohos]
linker = "aarch64-unknown-linux-ohos-clang"

[target.armv7-unknown-linux-ohos]
linker = "armv7-unknown-linux-ohos-clang"

[target.x86_64-unknown-linux-ohos]
linker = "x86_64-unknown-linux-ohos-clang"

[env]
CC_aarch64-unknown-linux-ohos = "aarch64-unknown-linux-ohos-clang"
CXX_aarch64-unknown-linux-ohos = "aarch64-unknown-linux-ohos-clang++"
AR_aarch64-unknown-linux-ohos = "llvm-ar"
CC_armv7-unknown-linux-ohos = "armv7-unknown-linux-ohos-clang"
CXX_armv7-unknown-linux-ohos = "armv7-unknown-linux-ohos-clang++"
AR_armv7-unknown-linux-ohos = "llvm-ar"
CC_x86_64-unknown-linux-ohos = "x86_64-unknown-linux-ohos-clang"
CXX_x86_64-unknown-linux-ohos = "x86_64-unknown-linux-ohos-clang++"
AR_x86_64-unknown-linux-ohos = "llvm-ar"

[net]
git-fetch-with-cli = true
